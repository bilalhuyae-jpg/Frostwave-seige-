name: Build and Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.${{ github.run_number }}.${{ github.run_attempt }}
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  APK_NAME: app-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            --target "${{ github.sha }}" \
            --title "Frostwave Siege $RELEASE_TAG" \
            --notes "Debug APK release built from commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE PUBLISHING SUCCEEDED ==="
            
            # Confirm the release using gh release view
            gh release view "$RELEASE_TAG"
            
            # Print the release tag
            echo "Release Tag: $RELEASE_TAG"
            
            # Print the release title
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq .name)
            echo "Release Title: $RELEASE_TITLE"
            
            # Print the direct GitHub Release page URL
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            
            # Print the exact APK asset filename
            echo "Exact APK asset filename: $APK_NAME"
            
            # Add the release page URL to GITHUB_STEP_SUMMARY
            echo "## 🚀 Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset:** \`$APK_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # Add a message explaining that the APK can be downloaded from the release Assets section
            echo "**Download Instructions:** You can download the APK directly from the **Assets** section on the release page." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # State that the normal Actions artifact is also available as a backup
            echo "**Backup Artifact:** The normal Actions artifact (\`app-debug-apk\`) is also available as a backup in the workflow run summary." >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact is also available as a backup."
          else
            echo "=== RELEASE PUBLISHING FAILED ==="
            
            # Print a clear warning
            echo "::warning::GitHub Release publishing failed."
            echo "WARNING: GitHub Release publishing failed."
            
            # State that the APK build succeeded
            echo "The APK build succeeded."
            
            # State that the Actions artifact named app-debug-apk remains available
            echo "The Actions artifact named app-debug-apk remains available."
            
            # Add the same warning and backup instructions to GITHUB_STEP_SUMMARY
            echo "## ⚠️ Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Warning:** GitHub Release publishing failed. However, the APK build succeeded!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact named \`app-debug-apk\` remains available for direct download at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
